<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="PwnIt gift voucher">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#13233f"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="800" height="500" rx="32"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="800" height="500" fill="url(#cardbg)"/>
    <circle cx="700" cy="60" r="190" fill="#ff0033" opacity="0.10"/>
    <circle cx="80" cy="470" r="220" fill="#10b981" opacity="0.08"/>
    <rect x="-80" y="330" width="980" height="2.5" fill="#ffffff" opacity="0.05" transform="rotate(-8 400 330)"/>
    <rect x="-80" y="372" width="980" height="2.5" fill="#ffffff" opacity="0.05" transform="rotate(-8 400 372)"/>

    <!-- bottom brand bar -->
    <rect x="0" y="478" width="800" height="22" fill="#ff0033"/>

    <!-- perforation + stub -->
    <line x1="572" y1="26" x2="572" y2="474" stroke="#64748b" stroke-width="2.5" stroke-dasharray="2 11" opacity="0.7"/>
    <text x="744" y="252" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="14" transform="rotate(-90 744 252)" text-anchor="middle">PWNIT</text>
    <!-- barcode -->
    <g fill="#e2e8f0">
      <rect x="606" y="330" width="6" height="96"/><rect x="617" y="330" width="3" height="96"/>
      <rect x="626" y="330" width="9" height="96"/><rect x="641" y="330" width="3" height="96"/>
      <rect x="650" y="330" width="5" height="96"/><rect x="661" y="330" width="11" height="96"/>
      <rect x="678" y="330" width="3" height="96"/><rect x="687" y="330" width="7" height="96"/>
      <rect x="700" y="330" width="4" height="96"/><rect x="710" y="330" width="9" height="96"/>
    </g>
    <text x="663" y="452" fill="#94a3b8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="15" letter-spacing="3" text-anchor="middle">PWN-0001</text>

    <!-- wordmark -->
    <text x="44" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" font-weight="900">
      <tspan fill="#e2e8f0">Pick. Play. </tspan><tspan fill="#ff0033">PwnIt.</tspan>
    </text>

    <!-- chip -->
    <rect x="452" y="44" width="78" height="56" rx="10" fill="url(#chip)"/>
    <g stroke="#b45309" stroke-width="2.5" opacity="0.85">
      <line x1="452" y1="63" x2="530" y2="63"/>
      <line x1="452" y1="81" x2="530" y2="81"/>
      <line x1="478" y1="44" x2="478" y2="100"/>
    </g>

    <!-- headline -->
    <text x="44" y="240" fill="#fffaf3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="104" font-weight="900" letter-spacing="2">GIFT</text>
    <text x="44" y="330" fill="#34d399" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="6">VOUCHER</text>

    <!-- footer line -->
    <text x="44" y="412" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="1">Pick a prize · Play the gauntlet · Top score wins it</text>
    <rect x="44" y="430" width="120" height="6" rx="3" fill="#ff0033"/>
  </g>

  <rect x="1.5" y="1.5" width="797" height="497" rx="31" fill="none" stroke="#1e293b" stroke-width="3"/>
</svg>
